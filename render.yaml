# Render blueprint.
#
# Point Render at this repository and it creates the service described here:
# one Node process, one persistent disk, HTTPS. Nothing else.
#
# Two things about the shape of this application decide the rest of the file:
#
#   1. The database is a FILE, and so is every uploaded passport scan. They
#      live on the disk mounted at /data. Without that disk they are inside the
#      container, and a container's filesystem is destroyed on every deploy —
#      taking every student account with it.
#
#   2. The messenger holds a connection open for as long as a counsellor has the
#      screen up. A free instance sleeps after 15 minutes without traffic and
#      takes about a minute to wake, which is fatal to a live chat and poor on a
#      marketing page. Starter is the real floor, not an upsell.
#
# One instance. Sessions, the chat hub and the database all live in this
# process and on its disk; a second instance would have half the conversations
# and its own copy of the data.

services:
  - type: web
    name: glovels
    runtime: node
    plan: standard             # 2 GB / 1 CPU — upgraded 4 Nov 2026 after Starter (512 MB / 0.5 CPU) crashed
    region: singapore          # nearest to Hyderabad of Render's regions
    branch: main
    numInstances: 1
    buildCommand: "echo 'nothing to build — this app has no dependencies'"
    # Patch 179 capped the JavaScript heap at 300 MB for the 512 MB Starter plan
    # (the restart loop of 31 Oct 2026). On Standard (2 GB) the cap is 1200 MB:
    # Node still tidies up before Render's limit, with ~800 MB left for SQLite,
    # buffers and the runtime itself. Exit status 134 on 4 Nov 2026 was most likely Node
    # hitting the old 300 MB cap.
    startCommand: "node --max-old-space-size=1200 serve.js"
    healthCheckPath: /api/health

    disk:
      name: glovels-data
      mountPath: /data
      sizeGB: 3              # was 1 (83% full on 4 Nov 2026); can be grown, never shrunk

    envVars:
      - key: NODE_VERSION
        value: "22"          # node:sqlite needs 22.5 or newer
      - key: GLOVELS_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: NODE_NO_WARNINGS
        value: "1"           # node:sqlite prints an experimental notice on every start

      # Generated by Render, once, and readable in the Environment tab. Nobody
      # types it, so nobody picks a bad one and nobody reuses it.
      - key: ADMIN_PASSWORD
        generateValue: true

      # Render asks for this when the blueprint is created.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false

      # GLOVELS_URL is deliberately absent: Render sets RENDER_EXTERNAL_URL to
      # the real address, and the server falls back to it. Set GLOVELS_URL by
      # hand only once a custom domain is pointed here.
